[package]
name = "relab-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native MCP server for the re-lab reverse-engineering pipeline: PE triage and safe case creation."
license = "MIT OR Apache-2.0"

[[bin]]
name = "relab-mcp"
path = "src/main.rs"

[dependencies]
# MCP framework (official Rust SDK). server + macros + stdio transport.
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pure-Rust analysis crates (no C toolchain / cmake needed).
goblin = "0.9"      # PE/COFF parsing
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# YARA is gated behind a feature: yara-x pulls wasmtime + a C dependency
# (alloca/cc) and raises the MSRV to 1.95, so it is OFF by default to keep the
# MVP build light (see tz-re-pipeline.md section 8).
yara-x = { version = "1.22", optional = true }

[features]
default = []
yara = ["dep:yara-x"]

[profile.release]
strip = true
lto = "thin"
