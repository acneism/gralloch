[package]
name = "gralloch-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native MCP server for the gralloch reverse-engineering pipeline: PE triage and safe case creation."
license = "MIT OR Apache-2.0"

[[bin]]
name = "gralloch-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

goblin = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

yara-x = { version = "1.22", optional = true }

[features]
default = []
yara = ["dep:yara-x"]

[profile.release]
strip = true
lto = "thin"
